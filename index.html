<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="toolbar">

    <div class="scroll-container">
      <button class="scroll-item active" data-tile="grass">
        <img src="Images/tile_0001.png" alt="Grass">
      </button>
      <button class="scroll-item" data-tile="road">
        <img src="Images/tile_0166.png" class="scroll-item img" alt="Road">
      </button>
      <button class="scroll-item" data-tile="water">
        <img src="Images/tile_0039.png" class="scroll-item img" alt="Water">
      </button>
      <button class="scroll-item" data-tile="building">
        <img src="Images/tile_0064.png" class="scroll-item img" alt="Building">
      </button>
      <button class="scroll-item" data-tile="park">
        <img src="Images/tile_0000.png" class="scroll-item img" alt="Park">
      </button>
    </div>

    <div class="toolbar-actions">
      <button class="toolbar-item" id="save-btn">Save</button>
      <button class="toolbar-item" id="load-btn">Load</button>
      <button class="toolbar-item" id="import-btn">Import JSON</button>
    </div>

  </div>

  <canvas id="mapCanvas"></canvas>

  <script src="script.js"></script>

</body>
</html>
