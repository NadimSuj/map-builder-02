<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="toolbar">

    <div class="scroll-container">
      <button class="scroll-item active" data-tile="grass">
        <img src="Images/tile_0001.png" alt="Grass">
      </button>
      <button class="scroll-item" data-tile="road">
        <img src="Images/tile_0144.png" alt="Road">
      </button>
      <button class="scroll-item" data-tile="road2">
        <img src="Images/tile_0110.png" alt="Road 2">
      </button>
      <button class="scroll-item" data-tile="road-ur">
        <img src="Images/tile_0129.png" alt="Road upper right corner">
      </button>
      <button class="scroll-item" data-tile="road-ul">
        <img src="Images/tile_0127.png" alt="Road upper left corner">
      </button>
      <button class="scroll-item" data-tile="intersection">
        <img src="Images/tile_0146.png" alt="Intersection">
      </button>
      <button class="scroll-item" data-tile="road-bl">
        <img src="Images/tile_0163.png" alt="Road bottom left corner">
      </button>
      <button class="scroll-item" data-tile="road-br">
        <img src="Images/tile_0165.png" alt="Road bottom right corner">
      </button>
      <button class="scroll-item" data-tile="water">
        <img src="Images/tile_0037.png" alt="Water">
      </button>
      <button class="scroll-item" data-tile="building">
        <img src="Images/tile_0064.png" alt="Building">
      </button>
      <button class="scroll-item" data-tile="park">
        <img src="Images/tile_0000.png" alt="Park">
      </button>
      <button class="scroll-item" data-tile="flowers">
        <img src="Images/tile_0002.png" alt="Flowers">
      </button>
      <button class="scroll-item" data-tile="building-gray">
        <img src="Images/tile_0009.png" alt="Single building gray">
      </button>
      <button class="scroll-item" data-tile="apartments">
        <img src="Images/tile_0044.png" alt="Apartments">
      </button>
      <button class="scroll-item" data-tile="factory">
        <img src="Images/tile_0083.png" alt="Factory">
      </button>
      <button class="scroll-item" data-tile="tree">
        <img src="Images/tile_0094.png" alt="Tree singular">
      </button>
      <button class="scroll-item" data-tile="trees">
        <img src="Images/tile_0112.png" alt="Trees">
      </button>
      <button class="scroll-item" data-tile="truck">
        <img src="Images/tile_0114.png" alt="Truck">
      </button>
      <button class="scroll-item" data-tile="plane">
        <img src="Images/tile_0154.png" alt="Plane">
      </button>
    </div>

    <div class="toolbar-actions">
      <button class="toolbar-item" id="save-btn">Save</button>
      <button class="toolbar-item" id="load-btn">Load</button>
      <button class="toolbar-item" id="clear-btn">Clear</button>
      <button class="toolbar-item" id="set-start-btn">Set Start</button>
      <button class="toolbar-item" id="set-end-btn">Set End</button>
      <button class="toolbar-item" id="astar-btn">A*</button>
      <button class="toolbar-item" id="bfs-btn">BFS</button>
      <button class="toolbar-item" id="dijkstra-btn">Dijkstra's</button>
    </div>

  </div>

  <canvas id="mapCanvas"></canvas>

  <div id="popup">
    <p id="popup-message"></p>
  </div>

  <script src="script.js"></script>

</body>
</html>
